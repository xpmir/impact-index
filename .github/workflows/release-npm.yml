name: Upload npm package

# Publishes the WASM build (wasm/) to npm as `impact-index`, from the same
# GitHub release as the Python packages (release.yml) but independently: a
# failure in one does not block the other. Both use the version in
# [workspace.package] of Cargo.toml.
#
# Publishing uses npm trusted publishing (OIDC, no token; provenance is
# generated automatically) with staged publishing: the workflow stages the
# version, which goes live only once a maintainer approves it on npmjs.com
# (2FA). On npmjs.com, package `impact-index` > Settings > Trusted
# Publisher: GitHub Actions, organization `xpmir`, repository
# `impact-index`, workflow `release-npm.yml`, environment `npm`, "Allow
# npm publish" and "Allow npm dist-tag" unticked (stage only). The GitHub
# environment `npm` (repository settings > Environments) can add its own
# protection rules.
#
# workflow_dispatch: dry run (build and pack, nothing is published).
#
# "[skip npm]" in the release notes when the release is created skips this
# workflow, e.g. `gh release create v1.10.1 --notes "[skip npm]"`. A version
# staged by mistake is rejected on npmjs.com instead of approved.

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    if: ${{ github.event_name != 'release' || !contains(github.event.release.body, '[skip npm]') }}
    runs-on: ubuntu-latest
    # must match the environment of the trusted publisher on npmjs.com
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'true'
      - name: Check tag matches the workspace version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$tag" != "$version" ]; then
            echo "::error file=Cargo.toml::Release tag $GITHUB_REF_NAME does not match Cargo.toml version $version. Bump [workspace.package] version in Cargo.toml (and Cargo.lock), then recreate the release."
            exit 1
          fi
          echo "Version $version matches tag $GITHUB_REF_NAME"
      - run: rustup toolchain install nightly-2026-09-20 --profile minimal --target wasm32-unknown-unknown
      # No registry-url: setup-node would then set a placeholder
      # NODE_AUTH_TOKEN, which breaks OIDC publishing
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: npm >= 11.15.0 (staged publishing)
        run: npm install -g 'npm@^11.15.0' && npm --version
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.1
      - name: Build the package
        run: wasm/build-npm.sh "$GITHUB_WORKSPACE/wasm/pkg"
      - name: Check the npm version matches the tag
        if: github.event_name == 'release'
        working-directory: wasm/pkg
        run: |
          version=$(npm pkg get version | tr -d '"')
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::package.json version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Check the package
        working-directory: wasm/pkg
        run: npm publish --dry-run
      - name: Stage for publication (approve on npmjs.com)
        if: github.event_name == 'release'
        working-directory: wasm/pkg
        run: npm stage publish
