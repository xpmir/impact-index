name: CI test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to the same branch/PR supersedes any run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'true'
    - run: rustup toolchain install nightly-2026-09-20 --profile minimal --component rustfmt,clippy
    # target/ and ~/.cargo, keyed by toolchain, Cargo.lock and job; saved
    # from master only, so that pull requests reuse it without churning it
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/master' }}
    - run: cargo test --features seismic
    # The block table decoded by term (on in the WASM build), natively; it
    # only changes indexes read through storage::ReaderFiles, which only
    # these tests (and the unit tests) do
    - run: cargo test --features lazy-pages --lib --test storage --test positions_compressed
    # Only the clippy.toml lints: file copies must go through src/utils/fs.rs
    - run: cargo clippy --all-targets --features seismic -- -A clippy::all -D clippy::disallowed_methods

  wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'true'
    - run: rustup toolchain install nightly-2026-09-20 --profile minimal --target wasm32-unknown-unknown
    # target/ and ~/.cargo, keyed by toolchain, Cargo.lock and job; saved
    # from master only, so that pull requests reuse it without churning it
    - uses: Swatinem/rust-cache@v2
      with:
        # also restored by release-npm.yml
        shared-key: wasm
        save-if: ${{ github.ref == 'refs/heads/master' }}
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Version of wasm-bindgen in Cargo.lock
      id: wasm-bindgen
      run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
    # Prebuilt binary instead of compiling it
    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
    - name: Core library without native features
      run: cargo build --target wasm32-unknown-unknown --no-default-features
    - name: Tests inside WASM
      run: cargo test -p impact-index-wasm --target wasm32-unknown-unknown
      env:
        CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    - name: WASM against native
      run: wasm/tests/check.sh

  python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'true'
    - run: rustup toolchain install nightly-2026-09-20 --profile minimal --component rustfmt
    # target/ and ~/.cargo, keyed by toolchain, Cargo.lock and job; saved
    # from master only, so that pull requests reuse it without churning it
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/master' }}
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Create virtualenv and install dependencies
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install maturin pytest pytest-asyncio numpy
    - name: Build and install package
      run: |
        source .venv/bin/activate
        maturin develop --release
    - name: Run Python tests
      run: |
        source .venv/bin/activate
        pytest python/ -v
