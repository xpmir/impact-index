name: CI test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to the same branch/PR supersedes any run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'true'
    - run: rustup toolchain install nightly-2026-09-20 --profile minimal --component rustfmt,clippy
    - run: cargo test --features seismic
    # Only the clippy.toml lints: file copies must go through src/utils/fs.rs
    - run: cargo clippy --all-targets --features seismic -- -A clippy::all -D clippy::disallowed_methods

  python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'true'
    - run: rustup toolchain install nightly-2026-09-20 --profile minimal --component rustfmt
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Create virtualenv and install dependencies
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install maturin pytest pytest-asyncio numpy
    - name: Build and install package
      run: |
        source .venv/bin/activate
        maturin develop --release
    - name: Run Python tests
      run: |
        source .venv/bin/activate
        pytest python/ -v
