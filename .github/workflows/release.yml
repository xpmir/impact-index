name: Upload python packages

# The npm package (wasm/) is published by release-npm.yml from the same
# release, independently: a failure in one does not block the other.
#
# "[skip pypi]" in the release notes when the release is created skips
# building and publishing the Python packages (release notes are still
# generated), e.g. `gh release create v1.10.1 --notes "[skip pypi]"`.

on:
  release:
    types: [created]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$tag" != "$version" ]; then
            echo "::error file=Cargo.toml::Release tag $GITHUB_REF_NAME does not match Cargo.toml version $version. Bump [workspace.package] version in Cargo.toml (and Cargo.lock), then recreate the release."
            exit 1
          fi
          echo "Version $version matches tag $GITHUB_REF_NAME"

  linux:
    needs: check-version
    if: ${{ !contains(github.event.release.body, '[skip pypi]') }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          # - runner: ubuntu-latest
          #   target: x86
          # - runner: ubuntu-latest
          #   target: aarch64
          # - runner: ubuntu-latest
          #   target: armv7
          # - runner: ubuntu-latest
          #   target: s390x
          # - runner: ubuntu-latest
          #   target: ppc64le
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'true'
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: nightly-2026-09-20
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.10 python3.11 python3.12 python3.13 python3.14
          sccache: 'true'
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist


  windows:
    needs: check-version
    if: ${{ !contains(github.event.release.body, '[skip pypi]') }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'true'
      - uses: actions/setup-python@v6
        id: py310
        with:
          python-version: '3.10'
          architecture: ${{ matrix.platform.target }}
      - uses: actions/setup-python@v6
        id: py311
        with:
          python-version: '3.11'
          architecture: ${{ matrix.platform.target }}
      - uses: actions/setup-python@v6
        id: py312
        with:
          python-version: '3.12'
          architecture: ${{ matrix.platform.target }}
      - uses: actions/setup-python@v6
        id: py313
        with:
          python-version: '3.13'
          architecture: ${{ matrix.platform.target }}
      - uses: actions/setup-python@v6
        id: py314
        with:
          python-version: '3.14'
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: nightly-2026-09-20
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ steps.py310.outputs.python-path }} ${{ steps.py311.outputs.python-path }} ${{ steps.py312.outputs.python-path }} ${{ steps.py313.outputs.python-path }} ${{ steps.py314.outputs.python-path }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    needs: check-version
    if: ${{ !contains(github.event.release.body, '[skip pypi]') }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'true'
      - uses: actions/setup-python@v6
        id: py310
        with:
          python-version: '3.10'
      - uses: actions/setup-python@v6
        id: py311
        with:
          python-version: '3.11'
      - uses: actions/setup-python@v6
        id: py312
        with:
          python-version: '3.12'
      - uses: actions/setup-python@v6
        id: py313
        with:
          python-version: '3.13'
      - uses: actions/setup-python@v6
        id: py314
        with:
          python-version: '3.14'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: nightly-2026-09-20
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ steps.py310.outputs.python-path }} ${{ steps.py311.outputs.python-path }} ${{ steps.py312.outputs.python-path }} ${{ steps.py313.outputs.python-path }} ${{ steps.py314.outputs.python-path }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    needs: check-version
    if: ${{ !contains(github.event.release.body, '[skip pypi]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'true'
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: nightly-2026-09-20
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    # Also runs (for the release notes) when the builds were skipped
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/') }}
    needs: [linux, windows, macos, sdist]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: 'true'
      - name: Generate changelog for this release
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md
      # The notes replace the body, markers included: say where this
      # version is published instead (registries may skip versions)
      - name: List the registries in the release notes
        env:
          SKIP_PYPI: ${{ contains(github.event.release.body, '[skip pypi]') }}
          SKIP_NPM: ${{ contains(github.event.release.body, '[skip npm]') }}
        run: |
          version=${GITHUB_REF_NAME#v}
          registries=""
          [ "$SKIP_PYPI" = true ] || registries="[PyPI](https://pypi.org/project/impact-index/$version/)"
          [ "$SKIP_NPM" = true ] || registries="${registries:+$registries, }[npm](https://www.npmjs.com/package/impact-index/v/$version)"
          case "$SKIP_PYPI,$SKIP_NPM" in
            true,false) note="WASM only: no Python release for this version." ;;
            false,true) note="Python only: no npm release for this version." ;;
            true,true) note="No package published for this version." ;;
            *) note="" ;;
          esac
          {
            echo "**Published to:** ${registries:-none}${note:+ — $note}"
            echo
            cat release-notes.md
          } > release-notes.tmp && mv release-notes.tmp release-notes.md
      - name: Update release notes
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
      - uses: actions/download-artifact@v7
        if: ${{ !contains(github.event.release.body, '[skip pypi]') }}
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Publish to PyPI
        if: ${{ !contains(github.event.release.body, '[skip pypi]') }}
        uses: pypa/gh-action-pypi-publish@release/v1
