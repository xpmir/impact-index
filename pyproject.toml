[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["extension-module"]

[project]
name = "impact-index"
requires-python = ">=3.8"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
authors = [
    {"email" = "benjamin@piwowarski.fr", name = "Benjamin Piwowarski"}
]
readme = "README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["python"]

[package]
licence = {file = "LICENCE.txt"}

# python/impact_index.pyi is auto-generated by pyo3-stub-gen; it contains
# references to the private module name that ruff flags as F821.
[tool.ruff.lint.per-file-ignores]
"python/impact_index.pyi" = ["F821"]
