default_install_hook_types:
  - pre-commit
  - commit-msg

exclude: ^BMP/

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/doublify/pre-commit-rust
  rev: v1.0
  hooks:
  - id: cargo-check
# rustfmt on the staged files only: `cargo fmt` would also reformat the BMP
# submodule (a path dependency, hence a workspace member) despite `exclude`
- repo: local
  hooks:
  - id: rustfmt
    name: rustfmt
    entry: rustfmt --edition 2021
    language: system
    types: [rust]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.11.4
  hooks:
  - id: ruff
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.3.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
