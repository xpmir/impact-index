[package]
name = "impact-index"
version = "1.9.3"
edition = "2021"
authors = ["Benjamin Piwowarski <benjamin@piwowarski.fr>"]
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[workspace]
members = [".", "wasm"]
default-members = ["."]
exclude = ["BMP/python"]

[lib]
name = "impact_index"
crate-type = ["cdylib", "rlib"]
bench = false
test = false

[features]
# Everything a native build has always had; the WASM build
# (`--no-default-features`, impact-index-wasm) leaves these out.
default = ["python", "mmap", "parallel", "progress", "zstd", "bmp"]
# Python bindings (src/py)
python = [
    "dep:pyo3",
    "dep:numpy",
    "dep:pyo3-async-runtimes",
    "dep:tokio",
    "dep:pyo3-log",
    "mmap",
    "parallel",
    "progress",
    "zstd",
    "bmp",
]
# Memory-mapped index and document store files
mmap = ["dep:memmap2"]
# Multi-threaded indexing / compression (sequential fallback without it)
parallel = ["dep:rayon"]
# Progress bars on long transforms
progress = ["dep:indicatif"]
# zstd (C library): document store and builder checkpoints
zstd = ["dep:zstd"]
# Conversion to Block-Max Pruning indexes
bmp = ["dep:bmp", "dep:protobuf", "progress"]
extension-module = ["python", "pyo3/extension-module"]
stub-gen = ["python", "pyo3-stub-gen"]
# Approximate learned-sparse search (Seismic). Opt-in: pulls git deps that
# require nightly (vectorium uses gen_blocks/portable_simd).
seismic = ["dep:seismic", "dep:vectorium"]

# Fat LTO + single codegen unit: lets LLVM inline/devirtualize across the
# whole crate graph, which matters for the dyn-heavy search hot paths.
# No panic=abort: pyo3 relies on unwinding to convert panics to exceptions.
[profile.release]
lto = "fat"
codegen-units = 1

# Faster variant of `release` for the manual wheel-check workflow
# (.github/workflows/build-wheels.yml): same optimizations, no fat LTO.
[profile.wheel-check]
inherits = "release"
lto = false
codegen-units = 16


[[bin]]
name = "stub_gen"
required-features = ["stub-gen"]

[[bench]]
name = "sparse"
harness = false

[[bench]]
name = "structured"
harness = false

[[bin]]
name = "profile_search"
path = "src/bin/profile_search.rs"
required-features = ["mmap"]

# [[bench.dependencies.helpers]]
# path = "libs/helpers"

[[test]]
name = "index"

[[test]]
name = "docstore"

[[test]]
name = "bm25"


[dependencies]
pyo3 = { version = "0.28", optional = true }
pyo3-stub-gen = { version = "0.19", optional = true }
pyo3-async-runtimes = { version = "0.28", features = ["attributes", "tokio-runtime"], optional = true }
pyo3-log = { version = "0.13", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
numpy = { version = "0.28", optional = true }
ndarray = { version = "0.15.4", features = [ "serde" ] }
serde = { version = "^1.0", features = ["derive"] }
simple-error = "0.2.3"
typetag = "0.2"
memmap2 = { version = "0.5.8", optional = true }
self_cell = "0.10.2"
bincode = "1.3.3"
ouroboros = "0.15"
derivative = "2.2.0"
# Manipulating bits
byteorder = "1.4.3"
bitstream-io = "2.3"
# Progress bars & log
log = { version = "0.4.17", features = ["max_level_debug", "release_max_level_info"] }
indicatif = { version = "0.15.0", optional = true }
# Serialization
ciborium = { version = "0.2" }
# Compression for checkpoints
zstd = { version = "0.13", optional = true }
serde_json = "1.0.120"
bmp = { path = "BMP", optional = true }
# Pinned upstream main: crates.io 0.2.1 hard-depends on pyo3 0.21 (links conflict).
# vectorium rev must match the one seismic uses so the types unify.
seismic = { git = "https://github.com/TusKANNy/seismic", rev = "3c267137e202748e69ada8cd093f4c0b7c04479c", default-features = false, optional = true }
vectorium = { git = "https://github.com/TusKANNy/vectorium", rev = "39e016c", optional = true }
half = { version = "2", features = ["serde", "bytemuck"] }
rayon = { version = "1", optional = true }
bitpacking = "0.9"
rust-stemmers = "1.2"
unicode-segmentation = "1.12"
# Word segmentation; the dictionaries (~3 MB) are not built in but loaded
# from the official ICU4X data blob, downloaded on demand (src/vocab/icu.rs)
icu_segmenter = { version = "~2.4", default-features = false, features = ["compiled_data", "serde"] }
icu_provider = { version = "2", features = ["sync"] }
icu_provider_blob = { version = "2", features = ["alloc"] }
sha2 = "0.10"
# Japanese / Korean morphological analysis (dictionaries loaded at runtime)
lindera = { version = "6.2", default-features = false }
# Downloading the Lindera dictionaries (into the OS cache directory)
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
protobuf = { version = "^2.27", optional = true }
# FST for term map (same as BMP uses)
fst = "0.4.7"

# statfs, to detect network filesystems (src/utils/fs.rs)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"


# sucds only builds on 64-bit targets; elsewhere (WASM) compress::elias_fano
# reads and writes the same bytes
[target.'cfg(target_pointer_width = "64")'.dependencies]
sucds = "0.5.0"

[dev-dependencies]
env_logger = "0.9.3"
criterion = "0.4.0"
ntest = "0.8.1"
rstest = "0.15.0"
temp-dir = "0.1.11"
rand_distr = "0.4.3"
rand = "0.8.5"

[dev-dependencies.helpers]
path = "libs/helpers"

[build-dependencies]
pyo3-build-config = "0.28"
