[package]
name = "impact-index"
version = "1.7.0"
edition = "2021"
authors = ["Benjamin Piwowarski <benjamin@piwowarski.fr>"]
license = "GPL-2.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[workspace]
members = ["."]
default-members = ["."]
exclude = ["BMP/python"]

[lib]
name = "impact_index"
crate-type = ["cdylib", "rlib"]
bench = false
test = false

[features]
extension-module = ["pyo3/extension-module"]
stub-gen = ["pyo3-stub-gen"]
# Approximate learned-sparse search (Seismic). Opt-in: pulls git deps that
# require nightly (vectorium uses gen_blocks/portable_simd).
seismic = ["dep:seismic", "dep:vectorium"]

# Fat LTO + single codegen unit: lets LLVM inline/devirtualize across the
# whole crate graph, which matters for the dyn-heavy search hot paths.
# No panic=abort: pyo3 relies on unwinding to convert panics to exceptions.
[profile.release]
lto = "fat"
codegen-units = 1

# Faster variant of `release` for the manual wheel-check workflow
# (.github/workflows/build-wheels.yml): same optimizations, no fat LTO.
[profile.wheel-check]
inherits = "release"
lto = false
codegen-units = 16


[[bin]]
name = "stub_gen"
required-features = ["stub-gen"]

[[bench]]
name = "sparse"
harness = false

[[bench]]
name = "structured"
harness = false

[[bin]]
name = "profile_search"
path = "src/bin/profile_search.rs"

# [[bench.dependencies.helpers]]
# path = "libs/helpers"

[[test]]
name = "index"

[[test]]
name = "docstore"

[[test]]
name = "bm25"


[dependencies]
pyo3 = { version = "0.28" }
pyo3-stub-gen = { version = "0.19", optional = true }
pyo3-async-runtimes = { version = "0.28", features = ["attributes", "tokio-runtime"] }
pyo3-log = "0.13"
tokio = { version = "1", features = ["full"] }
numpy = "0.28"
ndarray = { version = "0.15.4", features = [ "serde" ] }
serde = { version = "^1.0", features = ["derive"] }
simple-error = "0.2.3"
sucds = "0.5.0"
env_logger = "0.9.3"
typetag = "0.2"
memmap2 = "0.5.8"
self_cell = "0.10.2"
bincode = "1.3.3"
ouroboros = "0.15"
intertrait = "0.2.2"
derivative = "2.2.0"
# Manipulating bits
byteorder = "1.4.3"
bitstream-io = "2.3"
# Progress bars & log
log = { version = "0.4.17", features = ["max_level_debug", "release_max_level_info"] }
indicatif = "0.15.0"
# Serialization
ciborium = { version = "0.2" }
# Compression for checkpoints
zstd = "0.13"
serde_json = "1.0.120"
bmp = { path = "BMP" }
# Pinned upstream main: crates.io 0.2.1 hard-depends on pyo3 0.21 (links conflict).
# vectorium rev must match the one seismic uses so the types unify.
seismic = { git = "https://github.com/TusKANNy/seismic", rev = "3c267137e202748e69ada8cd093f4c0b7c04479c", default-features = false, optional = true }
vectorium = { git = "https://github.com/TusKANNy/vectorium", rev = "39e016c", optional = true }
half = { version = "2", features = ["serde", "bytemuck"] }
rayon = "1"
bitpacking = "0.9"
rust-stemmers = "1.2"
unicode-segmentation = "1.12"
protobuf = "^2.27"
# FST for term map (same as BMP uses)
fst = "0.4.7"


[dev-dependencies]
criterion = "0.4.0"
ntest = "0.8.1"
rstest = "0.15.0"
temp-dir = "0.1.11"
rand_distr = "0.4.3"
rand = "0.8.5"

[dev-dependencies.helpers]
path = "libs/helpers"

[build-dependencies]
pyo3-build-config = "0.28"
