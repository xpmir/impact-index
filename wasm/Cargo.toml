[package]
name = "impact-index-wasm"
version = "1.7.1"
edition = "2021"
authors = ["Benjamin Piwowarski <benjamin@piwowarski.fr>"]
license = "MIT OR Apache-2.0"
description = "WASM bindings (wasm-bindgen) for impact-index"
repository = "https://github.com/xpmir/impact-index"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
impact-index = { path = "..", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1.7"

[dev-dependencies]
wasm-bindgen-test = "0.3"
